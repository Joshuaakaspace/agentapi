[project]
name = "agentapi"
version = "0.1.0"
description = "A server runtime where the Run, not the Request, is the unit of work: durable, resumable, budgeted LLM and agent workloads with FastAPI-shaped ergonomics."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
keywords = [
    "llm", "agents", "agentic", "asgi", "starlette", "durable-execution",
    "streaming", "sse", "mcp", "model-context-protocol", "anthropic", "claude",
    "orchestration", "human-in-the-loop", "sandbox", "fastapi-alternative",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Joshuaakaspace/agentapi"
Repository = "https://github.com/Joshuaakaspace/agentapi"
Issues = "https://github.com/Joshuaakaspace/agentapi/issues"
Changelog = "https://github.com/Joshuaakaspace/agentapi/commits/main"
dependencies = [
    "starlette>=0.37",
    "pydantic>=2.6",
]

[project.scripts]
agentapi = "agentapi.cli:main"

[project.optional-dependencies]
server = ["uvicorn>=0.29"]
anthropic = ["httpx>=0.27"]
postgres = ["psycopg[binary,pool]>=3.1"]
redis = ["redis>=5.0"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "uvicorn>=0.29",
       "websockets>=12", "psycopg[binary,pool]>=3.1",
       "opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20", "redis>=5.0",
       "ruff>=0.6", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentapi"]
