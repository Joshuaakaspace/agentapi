[project]
name = "agentapi"
version = "0.1.0"
description = "A server runtime for LLM, agent and orchestration workloads: runs, not requests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "pydantic>=2.6",
]

[project.optional-dependencies]
server = ["uvicorn>=0.29"]
anthropic = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "uvicorn>=0.29"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentapi"]
