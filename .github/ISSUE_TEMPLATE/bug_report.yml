name: Bug report
description: Something behaved differently from what the docs promise
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. A run id and the event sequence from `GET /runs/{id}/events?stream=false`
        usually gets a bug fixed in one round-trip.
  - type: input
    id: version
    attributes:
      label: agentapi version / commit
    validations: {required: true}
  - type: dropdown
    id: llm
    attributes:
      label: LLM provider in use
      options: [MockLLM, AnthropicLLM, "other (say which)"]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the event sequence or a traceback if you have one.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: python
