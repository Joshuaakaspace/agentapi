<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a919e"/>
    </marker>
    <style>
      .box{fill:#f6f8fa;stroke:#c9d1d9;stroke-width:1.2}
      .core{fill:#eef4ff;stroke:#5b8def;stroke-width:1.6}
      .t{fill:#24292f}.d{fill:#57606a;font-size:11.5px}.h{fill:#24292f;font-weight:700}
      .ln{stroke:#8a919e;stroke-width:1.4;fill:none;marker-end:url(#a)}
      @media (prefers-color-scheme:dark){
        .box{fill:#161b22;stroke:#30363d}.core{fill:#0d2040;stroke:#58a6ff}
        .t{fill:#e6edf3}.d{fill:#8b949e}.h{fill:#e6edf3}.ln{stroke:#6e7681}
        #a path{fill:#6e7681}
      }
    </style>
  </defs>
  <text x="20" y="28" class="h">Attach to a run over any transport</text>
  <rect x="20" y="40" width="130" height="46" rx="8" class="box"/><text x="36" y="59" class="t">HTTP / SSE</text><text x="36" y="76" class="d">resumable by cursor</text>
  <rect x="160" y="40" width="130" height="46" rx="8" class="box"/><text x="176" y="59" class="t">WebSocket</text><text x="176" y="76" class="d">events out, signals in</text>
  <rect x="300" y="40" width="130" height="46" rx="8" class="box"/><text x="316" y="59" class="t">OpenAI-compat</text><text x="316" y="76" class="d">/v1/chat/completions</text>
  <rect x="440" y="40" width="130" height="46" rx="8" class="box"/><text x="456" y="59" class="t">MCP server</text><text x="456" y="76" class="d">your ops as tools</text>
  <rect x="580" y="40" width="130" height="46" rx="8" class="box"/><text x="596" y="59" class="t">Replay CLI</text><text x="596" y="76" class="d">offline, from journal</text>
  <path class="ln" d="M85 86 V118"/><path class="ln" d="M225 86 V118"/><path class="ln" d="M365 86 V118"/><path class="ln" d="M505 86 V118"/><path class="ln" d="M645 86 V118"/>

  <rect x="20" y="120" width="690" height="118" rx="8" class="core"/>
  <text x="36" y="143" class="h">The Run — not the request — is the unit of work</text>
  <text x="36" y="164" class="t">append-only event log · outlives the connection · detach / cancel / drain</text>
  <text x="36" y="184" class="t">ctx: deadline ↓ budget $ · usage · pause() for a human · journaled now()/uuid()</text>
  <text x="36" y="204" class="t">@step: retried, memoized · replay-based recovery · determinism checked at runtime</text>
  <text x="36" y="224" class="d">durability: ephemeral → resumable (memory) → durable (SQLite / Postgres, any worker resumes)</text>

  <rect x="730" y="40" width="170" height="198" rx="8" class="box"/>
  <text x="746" y="62" class="h">Cross-cutting</text>
  <text x="746" y="84" class="t">auth &amp; tenant isolation</text>
  <text x="746" y="104" class="t">per-principal rate limit</text>
  <text x="746" y="124" class="t">pools: fair queue, shed</text>
  <text x="746" y="144" class="t">redaction on write</text>
  <text x="746" y="164" class="t">OTEL · /metrics · logs</text>
  <text x="746" y="184" class="t">graceful shutdown</text>
  <text x="746" y="204" class="t">Redis fanout</text>
  <text x="746" y="224" class="d">all keyed by run_id</text>

  <path class="ln" d="M365 238 V268"/>
  <rect x="20" y="270" width="690" height="60" rx="8" class="box"/>
  <text x="36" y="292" class="h">Agent loop</text>
  <text x="36" y="312" class="t">model ↔ tools until the model stops · every call in the event log · budgets per turn</text>

  <path class="ln" d="M120 330 V360"/><path class="ln" d="M365 330 V360"/><path class="ln" d="M610 330 V360"/>
  <rect x="20" y="362" width="210" height="88" rx="8" class="box"/>
  <text x="36" y="384" class="h">Built-in tools</text>
  <text x="36" y="404" class="t">bash · read · write · edit</text>
  <text x="36" y="422" class="t">grep · glob · list</text>
  <text x="36" y="440" class="d">sandboxed workspace</text>
  <rect x="255" y="362" width="220" height="88" rx="8" class="box"/>
  <text x="271" y="384" class="h">Skills</text>
  <text x="271" y="404" class="t">SKILL.md dirs, discovered</text>
  <text x="271" y="422" class="t">progressive disclosure</text>
  <text x="271" y="440" class="d">scripts run sandboxed</text>
  <rect x="500" y="362" width="210" height="88" rx="8" class="box"/>
  <text x="516" y="384" class="h">MCP client</text>
  <text x="516" y="404" class="t">stdio · HTTP</text>
  <text x="516" y="422" class="t">server__tool as ops</text>
  <text x="516" y="440" class="d">scrubbed env, isolated</text>

  <rect x="730" y="270" width="170" height="180" rx="8" class="core"/>
  <text x="746" y="292" class="h">One policy gate</text>
  <text x="746" y="314" class="t">allow · deny · ask</text>
  <text x="746" y="334" class="d">deny-first matching</text>
  <text x="746" y="358" class="t">"ask" → ctx.pause()</text>
  <text x="746" y="378" class="d">approval survives a</text>
  <text x="746" y="394" class="d">process restart</text>
  <text x="746" y="420" class="d">applies equally to</text>
  <text x="746" y="436" class="d">built-in, skill, MCP</text>
  <path class="ln" d="M710 406 H732"/>
</svg>
